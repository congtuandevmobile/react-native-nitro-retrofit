name: Release rn-nitro-retrofit

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Package
        run: bun run prepare

      - name: Read package version
        id: version
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=beta" >> $GITHUB_OUTPUT
            echo "Detected Pre-release version: $VERSION (tag: beta)"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
            echo "Detected Release version: $VERSION (tag: latest)"
          fi

      - name: Check if tag exists
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "❌ Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          RAW_VERSION="${{ steps.version.outputs.version }}"

          if ! grep -qE "## ($VERSION|$RAW_VERSION)" CHANGELOG.md; then
            echo "❌ No changelog entry found for $VERSION or $RAW_VERSION"
            exit 1
          fi

          awk -v ver="$VERSION" -v raw="$RAW_VERSION" '
            $0 ~ "^## (" ver "|" raw ")" {flag=1; next}
            /^## / && flag {exit}
            flag
          ' CHANGELOG.md > release.md

          echo "📄 Release notes:"
          cat release.md

      - name: Publish package
        run: bun publish --access public --tag ${{ steps.version.outputs.npm_tag }}
        env:
          BUN_AUTH_TOKEN: ${{ secrets.TUANNC2_SECRET_KEY }}

      - name: Create git tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release.md
          prerelease: ${{ steps.version.outputs.is_prerelease }}
